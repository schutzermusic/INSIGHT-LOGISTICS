<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Plataforma de inteligência logística e análise de custos operacionais — Insight Logistics" />
  <meta name="theme-color" content="#0A0D14" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#F7F8FA" media="(prefers-color-scheme: light)" />
  <meta name="color-scheme" content="dark light" />
  <title>Insight Logistics | Intelligence Platform</title>

  <!-- Open Graph / Facebook / LinkedIn -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Insight Logistics" />
  <meta property="og:title" content="Insight Logistics — Intelligence Platform" />
  <meta property="og:description"
    content="Plataforma premium de inteligência logística: comparação multimodal, análise de rotas e custos operacionais em tempo real." />
  <meta property="og:locale" content="pt_BR" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Insight Logistics — Intelligence Platform" />
  <meta name="twitter:description"
    content="Plataforma premium de inteligência logística: comparação multimodal, análise de rotas e custos operacionais em tempo real." />

  <!-- Pre-hydration theme + motion init. Runs before React mounts, before
       any paint, so the first frame is already in the right theme and
       motion attribute selectors resolve correctly (no FOUC, no motion
       flash). Kept as a blocking inline script on purpose. -->
  <script>
    (function () {
      var root = document.documentElement;
      try {
        var storedTheme = localStorage.getItem('insight.theme');
        var mode = (storedTheme === 'light' || storedTheme === 'dark' || storedTheme === 'system') ? storedTheme : 'system';
        var resolved = mode === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : mode;
        if (resolved === 'dark') root.classList.add('dark');
        root.style.colorScheme = resolved;
        root.setAttribute('data-theme', resolved);
      } catch (_) {
        root.classList.add('dark');
        root.style.colorScheme = 'dark';
      }
      try {
        var storedMotion = localStorage.getItem('insight.motion');
        var motionPref = (storedMotion === 'full' || storedMotion === 'reduced' || storedMotion === 'off' || storedMotion === 'system')
          ? storedMotion
          : 'system';
        var motionResolved = motionPref;
        if (motionPref === 'system') {
          motionResolved = (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) ? 'reduced' : 'full';
        }
        root.setAttribute('data-motion', motionResolved);
      } catch (_) {
        root.setAttribute('data-motion', 'full');
      }
    })();
  </script>

  <!-- Type is self-hosted Helvetica Neue (subset, WOFF2 — see index.css).
       The render-blocking Google Fonts request for Outfit was removed.
       Roman/Medium carry almost all UI text and Light sets the large display
       numbers (the LCP text), so those three are preloaded. Bold is rare and
       loads on demand. -->
  <link rel="preload" href="/fonts/HelveticaNeue-Roman.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/HelveticaNeue-Medium.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/HelveticaNeue-Light.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="icon" type="image/png" href="/INSIGHT-LOGISTICS-SYMBOL.png" />
  <link rel="apple-touch-icon" href="/INSIGHT-LOGISTICS-SYMBOL.png" />
</head>

<body class="antialiased">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
